
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team 4 MERN Project - PhotoBooth</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #e6f4fd 0%, #cfe9fa 100%);
      background-attachment: fixed;
      color: #0d3b66;
      min-height: 100vh;
    }

    .topNav {
      background: #2a78b5;
      color: #fff;
      padding: 16px 28px;
      box-shadow: 0 2px 10px rgba(13, 59, 102, 0.25);
    }

    .topNav h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 0.5px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 520px;
      margin: 40px auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(42, 120, 181, 0.18);
    }

    .toolbar button {
      flex: 1 1 130px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      color: #0d3b66;
      background: #bfe1f8;
      border: 2px solid #8cc7ee;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .toolbar button:hover {
      background: #a5d3f3;
    }

    .toolbar button:active {
      transform: translateY(1px);
    }

    .toolbar button:focus-visible {
      outline: 3px solid #2a78b5;
      outline-offset: 2px;
    }

    .toolbar button.danger {
      background: #fff;
      color: #a12a3a;
      border-color: #e3a3ac;
    }

    .toolbar button.danger:hover {
      background: #fbe6e9;
    }
  </style>
</head>

<body>
  <div class="topNav">
    <h1>PhotoBooth</h1>
  </div>

  <div class="toolbar">
    <button>Upload</button>
    <button>Download</button>
    <button class="danger">Delete</button>
  </div>
</body>
</html>
